qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"  # 需要修改为包含港股数据的路径
    region: cn
market: &market 3690.HK  # 指定单只股票
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2018-01-01  # 美团较晚上市，所以开始时间不能太早
    end_time: 2023-12-31
    fit_start_time: 2018-01-01
    fit_end_time: 2021-12-31
    instruments: *market  # 使用单只股票
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 1  # 只关注一只股票
            n_drop: 1
    backtest:
        start_time: 2022-01-01
        end_time: 2023-12-31
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2018-01-01, 2021-12-31]
                valid: [2022-01-01, 2022-12-31]
                test: [2023-01-01, 2023-12-31]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config